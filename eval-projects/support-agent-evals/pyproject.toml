[project]
name = "support-agent-evals"
version = "0.1.0"
description = "Customer-support agent with LLM evaluation"
requires-python = ">=3.10"
dependencies = [
    "langgraph",
    "langchain",
    "langchain-core",
    "langchain-openai",
    "openai",
    "langsmith",
    "langfuse",
    "arize-phoenix",
    "deepeval",
    "ragas",
    "python-dotenv",
    "pytest",
    "pytest-asyncio"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "evals",
    "tests"
]
asyncio_default_fixture_loop_scope = "function"